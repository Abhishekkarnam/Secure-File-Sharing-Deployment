<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShare | Register</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <main class="auth-wrap">
        <section class="auth-panel">
            <div class="auth-brand">
                <p class="eyebrow">Create Access</p>
                <h1>SecureShare Registration</h1>
                <p>Create an account to upload encrypted files, browse your vault, and use the security tools.</p>
            </div>

            <div id="error-msg" class="alert error"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat your password" required>
                </div>

                <button type="submit" style="width: 100%; margin-top: 8px;">Create Account</button>
            </form>

            <p class="helper-text" style="margin-top: 18px;">Already have an account? <a href="/login.html">Back to login</a></p>
        </section>
    </main>
    <script src="../static/script.js"></script>
</body>
</html>
